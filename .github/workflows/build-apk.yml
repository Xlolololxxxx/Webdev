name: Build SourceScanner APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x SourceScanner/gradlew

    - name: Build Debug APK
      run: |
        cd SourceScanner
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: source-scanner-debug
        path: SourceScanner/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Build Release APK (unsigned)
      run: |
        cd SourceScanner
        ./gradlew assembleRelease --stacktrace
      continue-on-error: true

    - name: Upload Release APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: source-scanner-release
        path: SourceScanner/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
